version: '3.9'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: nexuspay_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexuspay
      POSTGRES_USER: nexuspay_user
      POSTGRES_PASSWORD: nexuspay_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexuspay_user -d nexuspay"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: nexuspay_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Backend
  backend:
    build: ./backend
    container_name: nexuspay_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.base
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-super-secret-dev-key}
      DEBUG: ${DEBUG:-False}
      DB_NAME: nexuspay
      DB_USER: nexuspay_user
      DB_PASSWORD: nexuspay_password
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ALLOWED_HOSTS: localhost,127.0.0.1,backend,nginx
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:5173,http://localhost:3000
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      CONVERSION_SPREAD_PERCENT: 0.5
      CONVERSION_FEE_PERCENT: 0.1
      OTP_SIMULATION_MODE: "True"
    volumes:
      - ./backend:/app
      - backend_static:/app/staticfiles
      - backend_media:/app/media
      - backend_logs:/app/logs
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"

  # Celery Worker
  celery_worker:
    build: ./backend
    container_name: nexuspay_celery
    restart: unless-stopped
    depends_on:
      - backend
      - redis
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.base
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-super-secret-dev-key}
      DB_NAME: nexuspay
      DB_USER: nexuspay_user
      DB_PASSWORD: nexuspay_password
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
    volumes:
      - ./backend:/app
    command: celery -A celery_app worker --loglevel=info --concurrency=4

  # Celery Beat (scheduler)
  celery_beat:
    build: ./backend
    container_name: nexuspay_beat
    restart: unless-stopped
    depends_on:
      - celery_worker
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.base
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-super-secret-dev-key}
      DB_NAME: nexuspay
      DB_USER: nexuspay_user
      DB_PASSWORD: nexuspay_password
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
    volumes:
      - ./backend:/app
    command: celery -A celery_app beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  # React Frontend
  frontend:
    build: ./frontend
    container_name: nexuspay_frontend
    restart: unless-stopped
    ports:
      - "3000:80"

  # Nginx Reverse Proxy
  nginx:
    build: ./nginx
    container_name: nexuspay_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - backend_static:/app/staticfiles:ro

volumes:
  postgres_data:
  backend_static:
  backend_media:
  backend_logs:
